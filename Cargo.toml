[package]
name = "ytdl-server"
version = "0.2.0"
edition = "2021"

[dependencies]
actix-files = "0.6"
actix-web = "4"
anyhow = "1"
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
